[project]
name = "fon-proposal-writer"
version = "1.0.0"
description = "FON Proposal Writer - RFP compliance extraction and proposal generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	# Core DSPy/AI dependencies
	"dspy>=3,<4",
	"openai>=1.99,<2",
	"langfuse==3.3.2",
	"openinference-instrumentation-dspy>=0.1.26",
	
	# Data processing
	"pydantic==2.11.7",
	"pydantic-settings>=2.6,<3",
	"pypdf==6.0.0",
	"python-docx>=1.1.0",
	"pandas>=2.2",
	"XlsxWriter>=3.2",
	"openpyxl>=3.1.5",
	"PyYAML>=6.0",
	"regex>=2024.11.6",
	"tqdm",
	"rapidfuzz>=3.14.0",
	
	# Azure services
	"azure-storage-blob>=12,<13",
	"azure-ai-documentintelligence>=1.0.0",
	
	# FastAPI backend
	"fastapi>=0.115.0",
	"uvicorn>=0.30.0",
	"python-multipart>=0.0.9",
	"python-dotenv>=1.0.0",
	
	# Streamlit frontend
	"streamlit>=1.50.0",
	"requests>=2.31.0",
]

[dependency-groups]
dev = [
	"pytest>=9.0.2",
	"pytest-asyncio>=0.21.0",
	"httpx>=0.24.0",
]
